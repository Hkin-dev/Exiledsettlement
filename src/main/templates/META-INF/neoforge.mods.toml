modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="hkin"
description='''
Build and manage a survival settlement whose people, buildings and supplies persist in the Minecraft world.
'''

[[mixins]]
config="exiledsettlement.mixins.json"

[[mixins]]
config="exiledsettlement.ysm.mixins.json"
requiredMods=["yes_steve_model", "ysm_mapping_api"]

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.235,21.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="yes_steve_model"
    type="optional"
    versionRange="[2.6.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ysm_mapping_api"
    type="optional"
    versionRange="[0.1.8,)"
    ordering="AFTER"
    side="BOTH"
